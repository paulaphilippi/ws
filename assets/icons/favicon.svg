  <path d="M7 42 C 15 42, 18 19, 25 19 C 32 19, 36 45, 44 41 C 49 38.5, 52 36, 57 36"
        fill="none" stroke="#141417" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Sleek white foreground trajectory curve -->
  <path d="M7 42 C 15 42, 18 19, 25 19 C 32 19, 36 45, 44 41 C 49 38.5, 52 36, 57 36"
        fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
