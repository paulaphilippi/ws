<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean matte-black background -->
  <rect width="64" height="64" rx="12" fill="#141417"/>

  <!-- Background Layer: Two thin, sleek, minimalist P letters -->
  <g fill="none" stroke="#8e8e98" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Left P -->
    <path d="M14 49V15H24.5C29.5 15 33 18.1 33 23.2C33 28.3 29.5 31.4 24.5 31.4H14"/>
    <!-- Right P -->
    <path d="M35 49V15H45.5C50.5 15 54 18.1 54 23.2C54 28.3 50.5 31.4 45.5 31.4H35"/>
  </g>

  <!-- Foreground Layer: Smooth affective reactivity & recovery curve -->
